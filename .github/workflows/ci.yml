# MCP service CI guards the executable part of the AI coding standard.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-security:
    name: Build, Test, and Security Checks
    runs-on: ubuntu-latest
    # 真库迁移测试用的 PostgreSQL 18 服务容器，只供本作业，结束即销毁。
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fleet_pg_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fleet_pg_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    # 迁移测试只连库名以 fleet_pg_test_ 开头的专用库；容器用 trust 认证，口令不起作用。
    env:
      FLEET_PG_TEST_URL: jdbc:postgresql://localhost:5432/fleet_pg_test_ci
      FLEET_PG_TEST_USERNAME: postgres
      FLEET_PG_TEST_PASSWORD: unused

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Checkout rpc-api dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sunkailun1992/rpc-api
          # Match the exact com:rpc-api:2.0.0 dependency when main advances.
          ref: 7f840d43c2e85efeabc3f6917298eab8b04e67fc
          path: .ci-rpc-api

      - name: Checkout utils dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sunkailun1992/utils
          # Match com:utils:2.0.6 exactly when dependency main advances.
          ref: 553293448ade72eb3ea57693b2bd307181bd3813 # com:utils 2.0.6
          path: .ci-utils

      - name: Hide CI dependency checkout from scans
        run: |
          echo ".ci-rpc-api/" >> .git/info/exclude
          echo ".ci-utils/" >> .git/info/exclude

      - name: Publish rpc-api to Maven Local
        working-directory: .ci-rpc-api
        run: ./gradlew -q publishToMavenLocal

      - name: Publish utils and observability to Maven Local
        working-directory: .ci-utils
        run: ./gradlew -q :fleet-observability:publishToMavenLocal publishToMavenLocal

      - name: Prepare scripts
        run: chmod +x gradlew scripts/check-secrets.sh

      - name: Compile
        run: ./gradlew -q compileJava

      - name: Test
        run: ./gradlew test

      - name: Secret warning scan
        run: bash scripts/check-secrets.sh
